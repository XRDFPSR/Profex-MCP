# GitHub Actions CI — Profex Build
# 每个 PR 和 push 到 main 分支时自动构建验证

name: Profex CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-qt5:
    name: "Qt5 Build (Ubuntu)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt5 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qtbase5-dev qt5-qmake qttools5-dev-tools \
            qtdeclarative5-dev libqt5svg5-dev libqt5xml5 \
            zlib1g-dev build-essential

      - name: Build with qmake
        run: |
          qmake profex.pro
          make -j$(nproc)

      - name: Verify build output
        run: |
          test -f profex/profex && echo "Build OK" || echo "Build produced no main binary (modules only)"

  build-docs:
    name: "Generate Doxygen Docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get install -y -qq doxygen graphviz

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: docs/doxygen/html/
